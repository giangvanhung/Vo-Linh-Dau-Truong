<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#17151d">
  <link rel="icon" type="image/png" sizes="128x128" href="/assets/characters/hung/avatar.png">
  <title>Tay cầm LAN | Võ Linh Đấu Trường</title>
  <link rel="stylesheet" href="/src/ui/controller.css">
</head>
<body>
  <header class="controller-header">
    <div class="controller-hero">
      <span>Võ Linh Đấu Trường</span>
      <h1>Tay cầm</h1>
    </div>
    <div class="controller-connect">
      <p id="connection" role="status">Chọn vị trí để kết nối.</p>
      <div id="join" aria-label="Chọn người chơi">
        <button type="button" data-player="1"><strong>P1</strong> Người chơi 1</button>
        <button type="button" data-player="2"><strong>P2</strong> Người chơi 2</button>
      </div>
      <div id="qr-reconnect">
        <button type="button" id="scan-qr">Quét QR mới</button>
        <label class="qr-file-picker">
          Chọn ảnh QR
          <input type="file" id="qr-image" accept="image/*">
        </label>
      </div>
      <section id="qr-scanner" aria-label="Camera quét QR" hidden>
        <video id="qr-preview" autoplay muted playsinline></video>
        <button type="button" id="stop-qr">Đóng camera</button>
      </section>
      <button type="button" id="leave" hidden>Rời tay cầm</button>
    </div>
  </header>
  <main id="pad" hidden>
    <div class="pad-tools">
      <button type="button" id="direction-mode" aria-pressed="false">Joystick</button>
      <button type="button" id="expand-pad" aria-pressed="false">Toàn màn hình</button>
      <button type="button" id="rotate-pad" aria-pressed="false">Xoay ngang</button>
      <button type="button" id="light-pad" aria-pressed="false">Màu sáng</button>
      <button type="button" id="choose-pad-bg">Ảnh nền</button>
      <button type="button" id="clear-pad-bg" hidden>Bỏ ảnh</button>
      <button type="button" id="leave-pad">Rời phòng</button>
      <input type="file" id="pad-bg-file" accept="image/*" hidden>
    </div>
    <div id="stick" hidden aria-label="Joystick di chuyển"><span></span></div>
    <section class="direction" aria-label="Di chuyển">
      <button data-key="w" aria-label="Nhảy">↑</button>
      <button data-key="a" aria-label="Trái">←</button>
      <button data-key="s" aria-label="Ngồi">↓</button>
      <button data-key="d" aria-label="Phải">→</button>
    </section>
    <section class="actions" aria-label="Chiến đấu">
      <div class="face">
      <button data-key="j">Đấm nhẹ</button><button data-key="k">Đấm nặng</button><button data-key="l">Đá</button>
      <button data-key="p">Đỡ</button>
      </div>
      <div class="skills">
      <button data-key="q">Lướt</button><button data-key="r" title="Giữ trái hoặc phải để chọn hướng">Lộn né</button><button data-key="enhanced">Lướt mạnh</button>
      <button data-key="u">Kỹ năng 1</button><button data-key="i">Kỹ năng 2</button><button data-key="o">Ultimate</button>
      <button data-key="f">Tụ khí</button><button data-key="g" title="Cần đủ nộ và đạt điều kiện Đột phá của võ sĩ">Tiến hóa</button>
      <button data-key="t">Thoát combo</button>
      </div>
    </section>
  </main>
  <script defer src="/src/vendor/jsqr.js"></script>
  <script type="module" src="/src/ui/controller.js"></script>
</body>
</html>
